# Sign-in with an OpenID Connect provider such as authentik (docs/stable/pipeline-engine/04-deployment-systemd.md,
# docs/stable/oidc-login/, deploy/authentik.md). A drop-in for runline-engine.service; without it, and
# without OIDC settings in runline.env, login is off. Install:
#   install -d /etc/systemd/system/runline-engine.service.d
#   install -m 0644 runline-engine-oidc.conf /etc/systemd/system/runline-engine.service.d/oidc.conf
#   systemctl daemon-reload
#
# The settings that are not secret (RUNLINE_OIDC_ISSUER, RUNLINE_OIDC_CLIENT_ID,
# RUNLINE_PUBLIC_BASE_URL and the optional ones) are in /etc/runline/runline.env, as
# runline.env.example says. The client secret and the key that seals the refresh tokens kept with
# sessions are systemd credentials: files only root can read, which systemd hands to this service
# alone in a directory of its own, so they are in no environment variable and in no file the
# service account owns. One line each:
#   install -m 0600 -o root -g root /dev/stdin /etc/runline/oidc-client-secret       # the client secret
#   openssl rand -base64 32 | install -m 0600 -o root -g root /dev/stdin /etc/runline/session-encryption-key
# Do not set RUNLINE_OIDC_CLIENT_SECRET or RUNLINE_SESSION_ENCRYPTION_KEY in runline.env as well: a
# value and a file for the same setting is a configuration error and the Engine does not start.
# Rotating either file takes effect at the next start of the service (systemctl restart).

[Service]
LoadCredential=oidc-client-secret:/etc/runline/oidc-client-secret
LoadCredential=session-encryption-key:/etc/runline/session-encryption-key
Environment=RUNLINE_OIDC_CLIENT_SECRET_FILE=%d/oidc-client-secret
Environment=RUNLINE_SESSION_ENCRYPTION_KEY_FILE=%d/session-encryption-key
