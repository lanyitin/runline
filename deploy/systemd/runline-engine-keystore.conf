# The keystore of the Engine's secrets (docs/stable/pipeline-engine/04-deployment-systemd.md,
# ADR-019). A drop-in for runline-engine.service; without it the Engine has no keystore, which is
# allowed. Install:
#   install -d /etc/systemd/system/runline-engine.service.d
#   install -m 0644 runline-engine-keystore.conf /etc/systemd/system/runline-engine.service.d/keystore.conf
#   systemctl daemon-reload
#
# The keystore is a file the service account may read and nobody else (the Engine warns when it is
# readable by others):
#   install -d -m 0750 -o root -g runline /etc/runline/keystore
#   install -m 0640 -o root -g runline runline.p12 /etc/runline/keystore/runline.p12
# Its password is a systemd credential: a file only root can read, which systemd hands to this
# service alone in a directory of its own, so the password is in no environment variable and in no
# file the service account owns:
#   install -m 0600 -o root -g root /dev/stdin /etc/runline/keystore-password   # one line, the password
# Neither lies inside the shared root, the resource root or the run root.

[Service]
LoadCredential=keystore-password:/etc/runline/keystore-password
Environment=RUNLINE_KEYSTORE_PATH=/etc/runline/keystore/runline.p12
Environment=RUNLINE_KEYSTORE_PASSWORD_FILE=%d/keystore-password
