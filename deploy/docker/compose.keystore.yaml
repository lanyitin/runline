# The keystore of the Engine's secrets (docs/stable/pipeline-engine/04-deployment-docker.md,
# ADR-019). An overlay on compose.yaml: without it the Engine has no keystore, which is allowed.
#
#   mkdir -p deploy/docker/keystore deploy/docker/secrets   # see the operating manual for the files
#   docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.keystore.yaml up -d
#   (or COMPOSE_FILE=compose.yaml:compose.keystore.yaml in .env)
#
# The keystore is mounted read-only, as a directory and not as the one file: an update replaces the
# file by renaming a new one over it, and a mount of the single file would go on showing the old
# one. Its password comes as a Docker secret, a file under /run/secrets, never an environment
# variable. Neither is in the image. The two host paths are set in .env; the defaults are
# beside this file and ignored by git.
#
# On a Linux host the Engine's account (uid 10001) must be able to read both files and nobody else
# should: the keystore directory owned by it or readable by its group, and the files mode 0400 or
# 0440; the Engine warns when a keystore is readable by others.

services:
  engine:
    environment:
      RUNLINE_KEYSTORE_PATH: /etc/runline/keystore/runline.p12
      RUNLINE_KEYSTORE_PASSWORD_FILE: /run/secrets/runline_keystore_password
    volumes:
      - type: bind
        source: ${KEYSTORE_HOST_DIR:-./keystore}
        target: /etc/runline/keystore
        read_only: true
    secrets:
      - runline_keystore_password

secrets:
  runline_keystore_password:
    file: ${KEYSTORE_PASSWORD_HOST_FILE:-./secrets/keystore-password}
