# The Engine for pipelines that drive a browser (docs/stable/pipeline-engine/04-deployment-systemd.md,
# docs/stable/digest-rss/04-deployment.md, WI-1001). A drop-in for runline-engine.service; without
# it the Engine starts as before. Install:
#   install -d /etc/systemd/system/runline-engine.service.d
#   install -m 0644 runline-engine-browser.conf /etc/systemd/system/runline-engine.service.d/browser.conf
#   install -m 0755 ../bin/runline-entrypoint ../bin/runline-browser-probe ../bin/runline-build-truststore /opt/runline/bin/
#   systemctl daemon-reload
#
# The host needs: Google Chrome (the package from Google, not Chromium), Xvfb (package xvfb),
# curl and procps (for the start-up report of the renderer), and the variables of the section
# "browser" in runline.env.example. The Chrome of a host runs with its sandbox: the container's
# --no-sandbox is not wanted here.
#
# It can be installed next to runline-engine-transcribe.conf (as transcribe.conf in the same directory): the
# two set no variable in common, and their CacheDirectory= names differ (deploy/transcribe.md, "與瀏覽器並用").
#
# The entrypoint starts the virtual display on DISPLAY (Xvfb, in the service's control group, so
# that stopping the service ends it), builds the JVM's truststore when RUNLINE_TRUSTED_CA_DIR is
# set, and starts the Engine in its own process. The Engine does not depend on any of it.

[Service]
ExecStart=
ExecStart=/opt/runline/bin/runline-entrypoint /usr/bin/java -jar /opt/runline/engine.jar
# A directory of the service's own for the JVM's temporary files, and java.io.tmpdir pointing at
# it: it is writable by the service account, and the SQLite driver loads its native library from it,
# so it must not be on a mount with noexec (findmnt -T /var/cache/runline).
CacheDirectory=runline
Environment=JDK_JAVA_OPTIONS=-Djava.io.tmpdir=/var/cache/runline
# Chrome needs a home directory it can write to (it keeps small files there, and crashes at start
# when there is none); a system account made with --no-create-home has none.
Environment=HOME=/var/cache/runline
