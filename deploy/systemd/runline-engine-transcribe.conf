# The Engine for the transcribe pipeline (docs/stable/transcribe-pipeline/04-deployment.md, WI-1402,
# deploy/transcribe.md). A drop-in for runline-engine.service; without it the Engine starts as before.
# Install (as root, from the repository):
#   install -d /opt/runline/bin /opt/runline/models /opt/runline/vad /etc/systemd/system/runline-engine.service.d
#   install -m 0755 deploy/bin/runline-transcribe-fetch deploy/bin/runline-vad deploy/bin/runline-denoise deploy/bin/runline-transcribe-check /opt/runline/bin/
#   TMP=$(mktemp -d) && /opt/runline/bin/runline-transcribe-fetch "$TMP" \
#     && install -m 0755 "$TMP/ffmpeg" "$TMP/ffprobe" /usr/local/bin/ \
#     && install -m 0755 "$TMP/deep-filter" /opt/runline/bin/ \
#     && install -m 0644 "$TMP/silero_vad.onnx" "$TMP/silero_vad.onnx.sha256" /opt/runline/models/
# (deep-filter is fetched for an amd64 host only; on another architecture leave that line out and run the
# pipeline with denoise=false, deploy/transcribe.md "降噪工具".)
#   install -m 0644 deploy/systemd/runline-engine-transcribe.conf /etc/systemd/system/runline-engine.service.d/transcribe.conf
#   systemctl daemon-reload
# Then put runline-vad.jar (WI-1407) at /opt/runline/vad/runline-vad.jar, set TRANSCRIBE_INTAKE_ROOT in
# /etc/runline/runline.env, make the intake root readable and writable for the account `runline`
# (for example runline:runline 0755 for the directory; the pipeline writes the subtitle files beside the
# videos, ADR-039), restart the Engine and run
#   sudo -u runline env $(grep -v '^#' /etc/runline/runline.env | xargs) /opt/runline/bin/runline-transcribe-check
#
# It can be installed next to runline-engine-browser.conf (as browser.conf in the same directory): the two
# set no variable in common, and their CacheDirectory= names differ (deploy/transcribe.md, "與瀏覽器並用").
# Everything here is a default that /etc/runline/runline.env replaces (an EnvironmentFile overrides
# Environment=). No Python is needed; the JRE that runs the Engine runs the VAD tool.

[Service]
# runline-vad is the command name of the VAD tool (the default of TRANSCRIBE_VAD_COMMAND); ffmpeg and
# ffprobe are in /usr/local/bin.
Environment=PATH=/opt/runline/bin:/usr/local/bin:/usr/bin:/bin
Environment=RUNLINE_VAD_MODEL=/opt/runline/models/silero_vad.onnx
Environment=RUNLINE_VAD_JAR=/opt/runline/vad/runline-vad.jar
# The denoising tool: runline-denoise (in /opt/runline/bin, on the PATH above) runs this deep-filter and
# refuses any other executable.
Environment=RUNLINE_DENOISE_BINARY=/opt/runline/bin/deep-filter
# The work directory: a directory of the service's own (writable by the account, removed with the
# service's cache by `systemctl clean`). About 115 MB per hour of video plus the frames; it must be on a
# file system with that much free space (deploy/transcribe.md).
CacheDirectory=runline-transcribe
Environment=TRANSCRIBE_WORK_DIR=/var/cache/runline-transcribe
# The intake root is writable for the Engine (the subtitle files, ADR-039); file permissions are what
# the check verifies. Nothing here makes it read-only: do not add ReadOnlyPaths= for the intake root.
